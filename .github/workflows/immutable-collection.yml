name: ERC-8060 immutable no-admin collection security tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci
      - name: Compile all references and adversarial receivers
        run: npm run compile
      - name: Run all pre-existing and new regression tests
        run: npm test
