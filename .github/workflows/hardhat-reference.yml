name: ERC-8060 strict reference tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hardhat-reference:
    name: Compile and execute real redemption tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile the reference and adversarial probes
        run: pnpm run compile

      - name: Run the complete Hardhat test suite
        run: pnpm test